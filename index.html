<style>
:root{--bg:#f4f5fb;--ink:#161a33;--mute:#6a7090;--line:#e7e9f3;--a:#14243f;--a2:#a8832f;--tint:#eef1f7;--ok:#0a8f4a;--bad:#e0102b;--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--h:"Sora","Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f)}
button{font:inherit;cursor:pointer}h1,h2,h3{font-family:var(--h);margin:0;letter-spacing:-.01em}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.wrap{max-width:1080px;margin:auto;padding:0 24px}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{transform:scaleY(0)}}@keyframes pop{from{opacity:0;transform:scale(.92)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}@keyframes float{50%{transform:translate(24px,-30px) scale(1.08)}}
.enter{animation:fade .35s ease}.enter li,.enter .stat,.enter .card,.enter .fc{animation:up .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 100ms)}
/* header */
.top{background:#fff;position:sticky;top:0;z-index:10;border-bottom:3px solid var(--a)}.top .wrap{display:flex;align-items:center;gap:18px;height:68px;max-width:none;padding:0 28px}.top nav{flex:1}
.logo{background:none;color:var(--a);border:0;padding:0;font:800 1.55rem var(--h);letter-spacing:.02em;transition:transform .3s;display:flex;align-items:center}.logo:hover{transform:scale(1.05)}
.logo i{font-style:normal;color:var(--a2)}.crest{height:2.1rem;width:auto;margin-right:3px;transition:transform .5s}.logo:hover .crest{transform:rotate(-6deg) scale(1.08)}
nav{display:flex;gap:6px}nav button{border:0;background:none;padding:9px 18px;border-radius:99px;font-weight:700;color:var(--mute);transition:background .3s,color .3s,transform .2s}
nav button:hover{background:var(--tint);color:var(--a);transform:translateY(-1px)}nav button.on{background:var(--a);color:#fff;box-shadow:0 6px 16px -6px var(--a)}
.mini{--w:var(--a);background:linear-gradient(var(--w),var(--w)) no-repeat 0 0/0 100% #fff;border:2px solid var(--w);color:var(--w);border-radius:99px;padding:6px 16px;font-weight:700;font-size:.88rem;transition:background-size .4s cubic-bezier(.2,.8,.2,1),color .3s,transform .15s,box-shadow .3s}
.mini:hover:not([disabled]){background-size:100% 100%;color:#fff;box-shadow:0 6px 14px -6px var(--w)}.mini:active{transform:scale(.95)}.mini[disabled]{opacity:.35;cursor:not-allowed}.out{--w:#e0102b}
.btn{background:linear-gradient(var(--a2),var(--a2)) no-repeat 0 0/0 100%,var(--a);color:#fff;border:0;border-radius:12px;padding:14px 32px;font-weight:800;transition:background-size .45s cubic-bezier(.2,.8,.2,1),transform .15s,box-shadow .3s;box-shadow:0 10px 22px -10px var(--a)}
.btn:hover:not([disabled]){background-size:100% 100%;transform:translateY(-2px)}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 10px 30px -14px rgba(22,26,51,.16);transition:transform .3s,box-shadow .3s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 36px -16px rgba(22,26,51,.22)}
h2{font-size:1.1rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}h2 small{font:600 .85rem var(--f);color:var(--mute)}
/* hero */
.wnav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.wnav b{font:700 1rem var(--h);min-width:130px;text-align:center}
.wnav button{width:38px;height:38px;border-radius:50%;border:2px solid var(--a);background:#fff;color:var(--a);font-size:1.2rem;line-height:1;transition:.3s}.wnav button:hover:not([disabled]){background:var(--a);color:#fff;transform:scale(1.1)}.wnav button[disabled]{opacity:.3;cursor:not-allowed}
.wnav em{font-style:normal;font-weight:700;font-size:.8rem;padding:4px 12px;border-radius:99px;background:var(--tint);color:var(--a)}
.hero{display:grid;grid-template-columns:1fr minmax(230px,300px) 1fr;gap:20px;align-items:center;background:var(--a);color:#fff;border-radius:26px;padding:26px 34px;box-shadow:0 22px 44px -20px var(--a);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#ffffff12;right:-80px;top:-120px;animation:float 10s ease-in-out infinite}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem)}.hero p{margin:4px 0 0;opacity:.85;font-weight:500}.hero>*{position:relative}
.gbox{background:#fff;border-radius:22px;padding:14px 16px 4px;box-shadow:0 14px 30px -14px rgba(0,0,0,.35)}
.st{text-align:right}.st b{display:block;font:800 clamp(1.5rem,3vw,2.2rem) var(--h)}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:800;margin-top:6px;animation:pop .5s .8s both}.chip.warn{background:#fff1d6;color:#b45309}.chip.bad{background:#ffe1e4;color:var(--bad)}
.gauge{width:100%;display:block}.gauge .trk{fill:none;stroke:#eceef7;stroke-width:16;stroke-linecap:round}
.gauge .val{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1),stroke .6s}

.fb2{flex:1;min-width:0}.fh{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mute);font-weight:700;margin-bottom:8px}

.wk li span,.pl li span,.cl li span.n{flex:1;font-weight:700}.wk li small,.pl li small,.cl li small{display:block;color:var(--mute);font-weight:500;font-size:.78rem}
.ck{width:24px;height:24px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ck path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .2s forwards}.dash{color:var(--mute);font-style:normal}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.chips>button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:6px 16px;font-weight:700;font-size:.85rem;color:var(--mute);transition:.25s}

.calbtn{display:inline-flex;gap:8px;align-items:center}.calbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pl li{cursor:pointer}.pl li.on{background:var(--tint);box-shadow:inset 4px 0 0 var(--a)}
.rgrid{display:grid;grid-template-columns:1fr 1.5fr;gap:24px;margin-top:6px}.panel{background:#fff;border-radius:20px;padding:26px;min-height:360px;box-shadow:0 10px 30px -14px rgba(22,26,51,.16);animation:pop .35s}
.rr{margin:16px 0}.rh{display:flex;justify-content:space-between;align-items:baseline}.rh span{font-weight:700}.rh i{font-style:normal;font-size:.72rem;font-weight:800;color:var(--a);background:var(--tint);padding:2px 8px;border-radius:99px;margin-left:6px}
.rv{font:800 1.6rem var(--h);color:var(--mute);transition:color .3s}.ri{display:flex;gap:14px;align-items:center;margin-top:6px}.rg{flex:1;height:6px;cursor:pointer}
.in{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;margin-bottom:12px;transition:border-color .25s,box-shadow .25s}.in:hover{border-color:#cdd1e6}
.in:focus{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 18%,transparent);outline:none}.nm{width:86px;margin:0;padding:8px;text-align:center}.ta{resize:vertical;min-height:64px}
.tl{font-weight:700;font-size:.85rem;display:block;margin:6px 0 4px}.tl.g{color:var(--ok)}.tl.b{color:var(--bad)}
.warn{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;color:var(--mute);margin:8px 0 20px;transition:.25s}

.lock{display:grid;place-items:center;height:300px;text-align:center;gap:8px;align-content:center}.lock .ck{width:76px;height:76px}.empty{color:var(--mute);padding:18px 6px}

.tile,.stat{background:#fff;border-radius:18px;padding:20px;text-align:center;box-shadow:0 10px 30px -14px rgba(22,26,51,.16);transition:transform .3s,box-shadow .3s,background .3s;border-bottom:4px solid var(--a)}

.tile b,.stat b{display:block;font:800 2.1rem var(--h)}.tile span,.stat span{color:var(--mute);font-weight:600;font-size:.85rem}.stat:nth-child(3){border-color:#ff8a1f}.stat:nth-child(4){border-color:#e0102b}

.bigav{width:88px;height:88px;border-radius:50%;background:#fff;color:var(--a);display:grid;place-items:center;font:800 2.4rem var(--h);animation:pop .5s}.phead h1{font-size:2rem}.phead p{margin:2px 0;opacity:.9}
.occ{display:block;font-size:.78rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;letter-spacing:.05em;margin:2px 0 4px;opacity:.92}
.cat{margin:14px 0}.cat div{display:flex;justify-content:space-between;font-weight:700}.cat i{font-style:normal;font-size:.72rem;color:var(--mute);margin-left:6px}.cat .tr{height:10px;margin-top:6px}
.chart{position:relative;padding:26px 0 0 30px}.plot{display:flex;gap:12px;align-items:flex-end;height:200px;position:relative}

.bv{font:800 .9rem var(--h);margin-bottom:4px}.bf{width:100%;max-width:60px;border-radius:8px 8px 0 0;transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;transition:filter .25s,transform .25s}
.wc:hover .bf{filter:brightness(1.12);transform:scaleY(1.04)}.wc.sel .bf{outline:3px solid var(--a2);outline-offset:2px}.bf.na{height:6px;background:#dfe2f0}
.labs{display:flex;gap:12px;margin:8px 0 0 30px}.labs div{flex:1;text-align:center;font-size:.72rem;font-weight:700;padding-bottom:4px;border-bottom:3px solid transparent}.labs div.now{border-color:var(--a2)}
.labs small{display:block;font-weight:800;min-height:1.2em}.up{color:var(--ok)}.dn{color:var(--bad)}.hint{color:var(--mute);font-size:.8rem;margin:12px 0 0 30px}
.sp li{padding:9px 12px;border-radius:10px;margin-bottom:8px;font-weight:500}.sp.g li{background:#e8f8ef;border-left:4px solid var(--ok)}.sp.b li{background:#ffecee;border-left:4px solid var(--bad)}
.seg{display:flex;background:#fff;padding:4px;border-radius:99px;gap:4px;width:fit-content;max-width:100%;box-shadow:0 4px 14px -8px rgba(22,26,51,.25)}
.seg button{border:0;background:none;padding:8px 18px;border-radius:99px;font-weight:700;color:var(--mute);transition:.25s}.seg button:hover{background:var(--tint);color:var(--a)}.seg button.on{background:var(--a);color:#fff}
.ctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:24px 0 10px}.ctl .in{width:220px;margin:0;border-radius:99px}
.cl li{cursor:pointer;background-color:#fff;margin-bottom:8px;box-shadow:0 4px 16px -10px rgba(22,26,51,.2)}.cl li:after{content:"›";font-size:1.5rem;color:var(--mute);transition:transform .3s}.cl li:hover:after{transform:translateX(5px);color:var(--a)}
.cl .chip{margin:0;animation:none;min-width:94px;text-align:center}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;padding:0;flex:none;transition:.3s}
.tick svg{width:16px;height:16px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transform:scale(0);transition:transform .3s}
.tick:hover{border-color:var(--ok);background:#e8f8ef}.tick:hover svg{transform:scale(1)}.tick.on{background:var(--ok);border-color:var(--ok)}.tick.on svg{stroke:#fff;transform:scale(1)}
.top2{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px}
/* login */
.login{min-height:calc(100vh - 71px)}.fw{display:grid;place-items:center;padding:40px 24px}.lc{width:100%;max-width:440px;background:#fff;border-radius:24px;padding:34px;box-shadow:0 24px 50px -24px rgba(22,26,51,.3);border-top:5px solid var(--a2)}
.lc h2{font-size:1.7rem;margin-bottom:4px;display:block;text-align:center}.lc>p{color:var(--mute);margin:0 0 20px;text-align:center}.lc .seg{margin:0 auto 20px;box-shadow:none;background:var(--tint)}.lc .btn{width:100%}.lc.shake{animation:shake .45s}
.dom{display:flex;border:2px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;overflow:hidden;transition:border-color .25s,box-shadow .25s}.dom:hover{border-color:#cdd1e6}
.dom:focus-within{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 18%,transparent)}.dom input{flex:1;min-width:0;border:0;padding:12px 4px 12px 14px;font:inherit;outline:none;background:transparent}
.dom span{padding:12px 14px 12px 0;color:var(--mute);font-weight:600;white-space:nowrap;font-size:.88rem}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:0 0 8px;font-size:.88rem}
.alt{text-align:center;margin:18px 0 0;color:var(--mute)}.alt a{color:var(--a);font-weight:800;cursor:pointer;background:linear-gradient(var(--a2),var(--a2)) no-repeat 0 100%/0 2px;transition:background-size .3s}.alt a:hover{background-size:100% 2px}
.pickwrap{max-width:940px;margin:0 auto;padding:36px 24px 60px}.pickwrap h2{font-size:1.8rem;display:block}.pickwrap .sub{color:var(--mute);margin:4px 0 26px}.prow{margin-bottom:22px}.prow h3{margin-bottom:10px;color:var(--a)}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.pbox{position:relative;border:2px solid var(--line);border-radius:18px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;color:var(--ink);background:linear-gradient(var(--a),var(--a)) no-repeat 0 100%/100% 0 #fff;transition:background-size .45s cubic-bezier(.2,.8,.2,1),transform .25s,box-shadow .25s,border-color .25s,color .3s}
.pbox:hover{background-size:100% 100%;color:#fff;transform:translateY(-4px);box-shadow:0 14px 26px -14px var(--a);border-color:var(--a)}.pbox.on{background-size:100% 100%;color:#fff;border-color:var(--a2);box-shadow:0 14px 26px -14px var(--a)}
.pbox b{font:800 1.1rem var(--h)}.pbox span{font-size:.85rem;opacity:.75}.pbox .ck{position:absolute;top:10px;right:10px;stroke:#fff;opacity:0;transform:scale(.4);transition:.3s}.pbox.on .ck{opacity:1;transform:none}
.pacts{display:flex;justify-content:flex-end;margin-top:14px}.pickwrap .err{text-align:right}

.modal.cal{max-width:372px}.ch{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}

.ch select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-weight:700;background:#fff;color:var(--a)}.ch div{display:flex;gap:6px}
.cw,.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.cw span{font-size:.72rem;font-weight:800;color:var(--mute);padding:4px 0}
.cdy{aspect-ratio:1;border:0;background:none;font:600 .9rem var(--f);border-radius:50%;color:var(--ink);margin:2px;transition:background .2s,color .2s,transform .2s}
.cdy:hover:not(.dis){background:var(--tint);transform:scale(1.12)}.cdy.t{box-shadow:inset 0 0 0 2px var(--a2)}.cdy.r,.cdy.pre{background:var(--tint);border-radius:6px}.cdy.s,.cdy.e{background:var(--a);color:#fff;border-radius:50%}.cdy.dis{opacity:.25;cursor:not-allowed}
.cp{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 8px}.cp .mini{padding:4px 12px;font-size:.8rem}.cs{font-weight:700;color:var(--a);margin:4px 0 14px;min-height:1.5em}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#111827;color:#fff;padding:12px 24px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}.ov.show{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:22px;max-width:410px;width:100%;padding:30px;border-top:6px solid var(--a2);transform:translateY(20px) scale(.96);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.ov.show .modal{transform:none}
.modal p{color:var(--mute)}.modal label{display:flex;gap:10px;font-weight:700;margin:16px 0 22px}.modal label input{accent-color:var(--a);width:18px;height:18px}.modal .acts{display:flex;gap:10px;justify-content:flex-end}

 return a.map((p,i)=>`<li style="--i:${Math.min(i,8)}" data-act="person" data-v="${esc(p.name)}"><button class="tick ${p.reviewed?'on':''}" data-act="tick" data-v="${esc(p.name)}" title="${p.reviewed?'Move back':'Mark as reviewed'}" aria-label="Reviewed">${CKW}</button><i class="av">${esc(p.name[0])}</i><span class="n">${esc(p.name)}<small>${esc(p.sub)}${hf.tab==='reviewed'?' · '+(p.role==='student'?'Student':'Teacher'):''}</small></span>${stChip(p.score)}<b class="pill" style="background:${p.score==null?'#9aa3b2':col(p.score)}">${p.score??'—'}</b></li>`).join('')||'<li class="empty">—</li>'}
function cases(){const ps=D.people,n=r=>ps.filter(p=>p.role===r).length,lo=ps.filter(p=>p.score!=null&&p.score<50).length,hr=ps.filter(p=>p.score!=null&&p.score<40).length,c=t=>t==='reviewed'?ps.filter(p=>p.reviewed).length:ps.filter(p=>!p.reviewed&&p.role===t).length;
 const sg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${hf[k]===v?'on':''}" data-act="hf" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
 return`<div class="stats">${[['Students',n('student')],['Teachers',n('teacher')],['Below 50',lo],['Below 40',hr]].map(([l,x],i)=>`<div class="stat" style="--i:${i}"><b>${x}</b><span>${l}</span></div>`).join('')}</div>
 <div class="ctl">${sg('tab',[['student','Students ('+c('student')+')'],['teacher','Teachers ('+c('teacher')+')'],['reviewed','Reviewed ('+c('reviewed')+')']])}<input class="in" id="q" placeholder="Search name" value="${esc(hf.q)}">${sg('f',[['all','All'],['50','Below 50'],['40','Below 40'],['unrated','Unrated']])}${sg('s',[['asc','Lowest'],['desc','Highest'],['name','A–Z']])}</div><ul class="cl" id="cl">${caseList()}</ul>`}
const fmtT=t=>new Date(t).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),KIND={lookup:'Viewed raters',reviewed:'Marked reviewed',unreviewed:'Moved back'};
const logPage=()=>`<h2 style="font-size:1.5rem">Access log</h2><div class="card"><ul class="wk">${D.audit.length?D.audit.map((a,i)=>`<li style="--i:${Math.min(i,8)};cursor:pointer" data-act="person" data-v="${esc(a.target)}"><span>${fmtT(a.t)}<small>${KIND[a.kind]||''}</small></span><span style="text-align:right;flex:none">${esc(a.target)}</span></li>`).join(''):'<li class="empty">—</li>'}</ul></div>`;
/* ---------- calendar ---------- */
function calHTML(){const {y,m,a,b}=cal,td=today(),off=(new Date(Date.UTC(y,m,1)).getUTCDay()+6)%7,n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),cy=+td.slice(0,4);let cells='<i></i>'.repeat(off);
 for(let d=1;d<=n;d++){const id=`${y}-${pad(m+1)}-${pad(d)}`,fut=id>td,e=b||a;cells+=`<button class="cdy${fut?' dis':''}${id===a?' s':''}${id===e?' e':''}${a&&b&&id>a&&id<b?' r':''}${id===td?' t':''}" ${fut?'disabled':''} data-act="cd" data-v="${id}">${d}</button>`}
 const r=a?{from:a,to:b||a}:null;
 return`<div class="ch"><button data-act="cm" data-v="-1" aria-label="Previous month">‹</button><div><select id="cmo">${MO.map((x,i)=>`<option value="${i}" ${i===m?'selected':''}>${x}</option>`).join('')}</select><select id="cyr">${[cy-2,cy-1,cy].map(x=>`<option ${x===y?'selected':''}>${x}</option>`).join('')}</select></div><button data-act="cm" data-v="1" aria-label="Next month">›</button></div>
 <div class="cw">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cg">${cells}</div>
 <div class="cp">${[['w','Mon–Fri'],['l','Last week'],['7','Last 7 days'],['m','This month']].map(([k,l])=>`<button class="mini" data-act="cpre" data-v="${k}">${l}</button>`).join('')}</div>
 <p class="cs">${r?fr(r):'Tap a start date, then an end date'}</p><div class="acts"><button class="mini" data-act="cclear">Clear</button><button class="mini" data-act="ccancel">Cancel</button><button class="btn" data-act="capply" style="padding:9px 22px" ${a?'':'disabled'}>Apply</button></div>`}
const calShow=()=>{$('#calbox').innerHTML=calHTML()};
function calOpen(){const b=rng?rng.from:today();cal={y:+b.slice(0,4),m:+b.slice(5,7)-1,a:rng?rng.from:null,b:rng&&rng.to!==rng.from?rng.to:null};calShow();$('#ovc').classList.add('show')}
function preset(k){const td=today();if(k==='w')return wr(D.week);if(k==='l')return wr(D.week-1);if(k==='7'){const d=U(td);d.setUTCDate(d.getUTCDate()-6);return{from:d.toISOString().slice(0,10),to:td}}return{from:td.slice(0,8)+'01',to:td}}
/* ---------- render ---------- */
async function render(){const root=$('#root');
 if(step==='pick'){root.innerHTML=pickView();return}
 if(!user){root.innerHTML=loginView();return}
 const hod=user.role==='hod';let path;
 if(hod)path=page==='log'?'audit':page==='person'?'person?name='+enc(pid)+'&'+rq():'cases';
 else path=page==='rate'?'targets?sec='+enc(sec||''):page==='profile'?'profile?'+rq():page==='feedbacks'?`feedbacks?sort=${fsort}&${rq()}`:`home?w=${vw??''}&sec=${enc(sec||'')}`;
 try{D=await api(path)}catch(e){if(e.code===401){user=null;return render()}toast(e.message);return}
 if(D.sec)sec=D.sec;
 const h=hod?(page==='log'?logPage():page==='person'?stats(1):cases()):page==='rate'?rate():page==='profile'?stats(0):page==='feedbacks'?feedbacks():home();
 root.innerHTML=shell(h);setTimeout(()=>{const a=$('#app');a&&a.classList.remove('enter')},1200);
 if($('#ga'))setTimeout(()=>setG('g',D.score),250)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('show'),2400)}
async function send(){try{await api('rate',{target:sel,vals:form.v,warn:form.w,good:form.good,bad:form.bad,declared:user.role==='student'});D.targets.find(x=>x.name===sel).done=true;toast('Sent anonymously');form=blank();sel=(D.targets.find(x=>!x.done)||{name:sel}).name;refresh()}catch(e){toast(e.message)}}
function err(m){const e=$('#err');if(!e)return toast(m);e.textContent=m;const c=$('#card')||e;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
const hk=()=>user&&user.role==='hod'?'cases':'home';
/* history: Back always returns to the home page, never the login page */
function setPage(p,id){const hm=hk();if(id!==undefined)pid=id;if(p!==page)rng=null;
 if(p===hm){if(page!==hm){page=hm;vw=null;history.back();return}vw=null;render();return}
 if(page===hm)history.pushState({p,pid},'');else history.replaceState({p,pid},'');page=p;render()}
addEventListener('popstate',e=>{if(!user||step)return;const s=e.state||{};if(s.g||!s.p){history.pushState({p:hk()},'');page=hk()}else{page=s.p;pid=s.pid}vw=null;rng=null;render()});
function enter(){page=hk();sel=null;sec=null;vw=null;rng=null;form=blank();step=null;mode='in';history.replaceState({g:1},'');history.pushState({p:page},'');render();toast('Welcome, '+user.name)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
if(a==='nav')setPage(v);
else if(a==='home'){if(user)step||setPage(hk());else{mode='in';render()}}
else if(a==='lrole'){lrole=v;render()}
else if(a==='mode'){mode=v;render()}
else if(a==='fill'){const p=v.split('|'),f=$('#af').elements;f.id.value=p[0];f.pass.value=p[1]}
else if(a==='pbox'){pickSel=pickSel.includes(v)?pickSel.filter(x=>x!==v):[...pickSel,v];document.querySelectorAll('.pbox').forEach(x=>x.classList.toggle('on',pickSel.includes(x.dataset.v)));$('#pgo').disabled=!pickSel.length}
else if(a==='pgo'){try{user=await api('sections',{sections:pickSel});enter()}catch(x){err(x.message)}}
else if(a==='logout')$('#ov2').classList.add('show');
else if(a==='go'){sel=v;form=blank();setPage('rate')}
else if(a==='pick'){sel=v;form=blank();refresh()}
else if(a==='warn'){form.w=!form.w;$('#panel').innerHTML=panelHTML()}
else if(a==='submit'){if(user.role==='student'){$('#agree').checked=false;$('#sign').disabled=true;$('#ov').classList.add('show')}else send()}
else if(a==='pw'){vw=D.viewWeek-1;render()}else if(a==='nw'){vw=D.viewWeek+1>=D.week?null:D.viewWeek+1;render()}
else if(a==='sec'){sec=v;sel=null;render()}
else if(a==='hf'){hf[b.dataset.k]=v;$('#app').innerHTML=cases();$('#app').classList.remove('enter')}
else if(a==='person')setPage('person',v);
else if(a==='rg'){rng=v==='o'?null:v==='t'?wr(D.week):wr(D.week-1);render()}
else if(a==='wkbar'){rng=wr(+v);render()}
else if(a==='fsort'){fsort=v;render()}
else if(a==='cal')calOpen();
else if(a==='cd'){if(!cal.a||cal.b){cal.a=v;cal.b=null}else if(v<cal.a){cal.b=cal.a;cal.a=v}else if(v===cal.a)cal.b=null;else cal.b=v;calShow()}
else if(a==='cm'){cal.m+=+v;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}calShow()}
else if(a==='cpre'){const r=preset(v);cal.a=r.from;cal.b=r.to===r.from?null:r.to;cal.y=+r.from.slice(0,4);cal.m=+r.from.slice(5,7)-1;calShow()}
else if(a==='cclear'){rng=null;$('#ovc').classList.remove('show');render()}
else if(a==='ccancel')$('#ovc').classList.remove('show');
else if(a==='capply'){rng={from:cal.a,to:cal.b||cal.a};$('#ovc').classList.remove('show');render()}
else if(a==='tick'){const p=page==='person'?D:D.people.find(x=>x.name===v);try{await api('reviewed',{name:v,value:!p.reviewed});p.reviewed=!p.reviewed;toast(p.reviewed?'Moved to Reviewed':'Moved back');if(page==='person')render();else{$('#app').innerHTML=cases();$('#app').classList.remove('enter')}}catch(x){toast(x.message)}}
else if(a==='raters'){try{const r=await api('raters?name='+enc(v));$('#rl').innerHTML=r.raters.map(x=>`<li><span class="n" style="flex:1;font-weight:700">${esc(x.by)}</span>${x.warn?'<span class="chip bad" style="margin:0;animation:none">Final warning</span>':''}<b class="pill" style="background:${col(x.s)}">${x.s}</b><small>${fd(x.d)}</small>${x.good||x.bad?`<div class="cm">${x.good?`<p class="g">${esc(x.good)}</p>`:''}${x.bad?`<p class="b">${esc(x.bad)}</p>`:''}</div>`:''}</li>`).join('')||'<li class="empty">—</li>';toast('Access logged')}catch(x){toast(x.message)}}});
document.addEventListener('change',e=>{if(e.target.id==='cmo'){cal.m=+e.target.value;calShow()}if(e.target.id==='cyr'){cal.y=+e.target.value;calShow()}});
document.addEventListener('mouseover',e=>{const c=e.target.closest('.cdy');if(!c||!cal.a||cal.b)return;const h=c.dataset.v;document.querySelectorAll('.cdy').forEach(x=>{const v=x.dataset.v;x.classList.toggle('pre',(v>cal.a&&v<=h)||(v<cal.a&&v>=h))})});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){hf.q=el.value;$('#cl').innerHTML=caseList();return}
 if(el.dataset.t){form[el.dataset.t]=el.value;return}
 const j=el.dataset.r;if(j===undefined||el.value==='')return;const v=clamp(Math.round(+el.value)),row=el.closest('.rr');form.v[+j]=v;
 if(el.type==='range')row.querySelector('.nm').value=v;else row.querySelector('.rg').value=v;
 row.querySelector('.rg').style.accentColor=col(v);const o=row.querySelector('.rv');o.textContent=v;o.style.color=col(v);$('#send').disabled=!form.v.every(x=>x!==null)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 try{
  if(mode==='in'){if(!f.id||!f.pass)return err('Fill in all fields');user=await api('login',{role:lrole,id:f.id,pass:f.pass});if(user.role==='teacher'){step='pick';pickSel=(user.sections||[]).slice();render()}else enter()}
  else if(mode==='forgot'){if(!f.id)return err('Enter your '+(lrole==='student'?'school email':'username'));await api('forgot',{role:lrole,id:f.id});fid=f.id;mode='reset';render();toast('If the account exists, a code was emailed')}
  else{if(!f.otp||!f.pass)return err('Fill in all fields');if(f.pass!==f.pass2)return err("Passwords don't match");await api('reset',{role:lrole,id:fid,otp:f.otp,pass:f.pass});mode='in';render();toast('Password updated. Please sign in.')}
 }catch(x){if(mode==='in')user=null;err(x.message)}});
$('#agree').onchange=e=>$('#sign').disabled=!e.target.checked;
$('#cancel').onclick=()=>$('#ov').classList.remove('show');
$('#sign').onclick=()=>{$('#ov').classList.remove('show');send()};
$('#stay').onclick=()=>$('#ov2').classList.remove('show');
$('#leave').onclick=async()=>{$('#ov2').classList.remove('show');try{await api('logout',{})}catch(x){}user=null;page='home';sel=null;sec=null;vw=null;rng=null;form=blank();mode='in';render();toast('Logged out')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'))});
(async()=>{try{demo=(await api('config')).demo}catch(e){}try{user=await api('me')}catch(e){user=null}page=hk();if(user){history.replaceState({g:1},'');history.pushState({p:page},'')}render()})();
</script>
</body>
</html>
